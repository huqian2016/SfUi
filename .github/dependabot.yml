version: 2
updates:
  # NuGet パッケージ（Core / Presentation / App / Avalonia / Tests）
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
  # GitHub Actions（ci.yml / codeql.yml）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
