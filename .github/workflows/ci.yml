name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Run tests (Core + Presentation)
        run: dotnet test tests/SfUi.Tests/SfUi.Tests.csproj -c Release

  build-avalonia:
    name: Build Avalonia app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Build (Avalonia, cross-platform)
        run: dotnet build src/SfUi.Avalonia/SfUi.Avalonia.csproj -c Release
      - name: Smoke run (--smoke, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src/SfUi.Avalonia/bin/Release/net9.0/SfUi.Avalonia.exe"
          $data = Join-Path $env:RUNNER_TEMP "sfui-smoke"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke", "--data-dir", $data -PassThru
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            Write-Error "smoke timed out after 180s"
            Get-ChildItem "$data\logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ -Tail 60 }
            exit 1
          }
          Write-Host "smoke exit code: $($p.ExitCode)"
          Get-ChildItem "$data\logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_ -Tail 60 }
          exit $p.ExitCode

  build-wpf:
    name: Build WPF app (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Build (WPF, Windows)
        run: dotnet build src/SfUi.App/SfUi.App.csproj -c Release

  package-macos:
    name: Package .app (macos-latest)
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
      NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
      NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      # Developer ID 署名（secrets 未登録の間は自動スキップ = 従来どおり未署名ビルド）
      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          echo "MACOS_CERT_P12 length: ${#MACOS_CERT_P12}"
          printf '%s' "$MACOS_CERT_P12" > cert.b64

          # macOS の base64 はバージョンで受け付けるデコード オプションが異なるため順に試す
          decode_ok=0
          for variant in -d -D --decode; do
            if base64 "$variant" < cert.b64 > cert.p12 2>/dev/null && [ -s cert.p12 ]; then
              decode_ok=1
              echo "decoded with: base64 $variant"
              break
            fi
          done
          if [ "$decode_ok" = "0" ]; then
            if openssl base64 -d -A -in cert.b64 -out cert.p12 2>/dev/null && [ -s cert.p12 ]; then
              decode_ok=1
              echo "decoded with: openssl base64"
            fi
          fi
          [ "$decode_ok" = "1" ] || fail "cert.p12 decode failed - check the MACOS_CERT_P12 secret (base64 of the exported .p12)"
          rm -f cert.b64
          size=$(wc -c < cert.p12 | tr -d ' ')
          echo "cert.p12 size: $size bytes"
          [ "$size" -gt 1000 ] || fail "cert.p12 is only $size bytes - the MACOS_CERT_P12 secret looks truncated"

          security create-keychain -p actions build.keychain || fail "security create-keychain failed (rc=$?)"
          security default-keychain -s build.keychain || fail "security default-keychain failed (rc=$?)"
          security unlock-keychain -p actions build.keychain || fail "security unlock-keychain failed (rc=$?)"
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign || fail "security import failed - check MACOS_CERT_PASSWORD (rc=$?)"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain >/dev/null || fail "security set-key-partition-list failed (rc=$?)"
          rm -f cert.p12

          IDENTITIES="$(security find-identity -v -p codesigning build.keychain || true)"
          echo "$IDENTITIES"
          IDENTITY="$(printf '%s' "$IDENTITIES" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          [ -n "$IDENTITY" ] || fail "Developer ID Application identity not found in the imported certificate"
          echo "SFUI_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"
          echo "::notice::Developer ID signing enabled: $IDENTITY"
      - name: Build .app bundle (packaging/make-mac-app.sh)
        env:
          SFUI_NOTARIZE_APPLE_ID: ${{ env.NOTARIZE_APPLE_ID }}
          SFUI_NOTARIZE_TEAM_ID: ${{ env.NOTARIZE_TEAM_ID }}
          SFUI_NOTARIZE_PASSWORD: ${{ env.NOTARIZE_PASSWORD }}
        run: bash packaging/make-mac-app.sh osx-arm64
      # 署名 / 公証の検証（手順書 §6 の spctl / stapler validate を CI でも自動実行）
      - name: Verify signature and notarization (when signing is enabled)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/mac/SfUi.app
          SPCTL_OUT="$(spctl -a -vvv -t exec dist/mac/SfUi.app 2>&1 || true)"
          echo "$SPCTL_OUT"
          SOURCE="$(printf '%s' "$SPCTL_OUT" | awk -F'=' '/^source=/ { print $2; exit }' | tr -d ' ')"
          if [ "${SOURCE:-}" = "NotarizedDeveloperID" ]; then
            echo "::notice::verification: accepted / source=Notarized Developer ID"
          else
            echo "::warning::verification: spctl source is '${SOURCE:-unknown}' - notarization may have been skipped"
          fi
          if xcrun stapler validate dist/mac/SfUi.app >/dev/null; then
            echo "::notice::stapler validate: OK"
          else
            echo "::warning::stapler validate: failed"
          fi
      - name: Smoke run the packaged app (--smoke)
        shell: bash
        run: |
          set +e
          APP="dist/mac/SfUi.app/Contents/MacOS/SfUi.Avalonia"
          DATA="$RUNNER_TEMP/sfui-smoke"
          "$APP" --smoke --data-dir "$DATA" &
          PID=$!
          TIMED_OUT=1
          for _ in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then TIMED_OUT=0; break; fi
            sleep 2
          done
          if [ "$TIMED_OUT" = "1" ]; then
            kill "$PID" 2>/dev/null
            echo "::error::smoke timed out after 120s"
            cat "$DATA"/logs/*.log 2>/dev/null | tail -60
            exit 1
          fi
          wait "$PID"
          CODE=$?
          echo "smoke exit code: $CODE"
          cat "$DATA"/logs/*.log 2>/dev/null | tail -60
          exit $CODE
      - name: Show bundle layout
        run: |
          find dist/mac/SfUi.app -maxdepth 2 -type d | head -10 || true
          ls -lh dist/mac/*.zip
      - name: Upload .app zip
        uses: actions/upload-artifact@v4
        with:
          name: SfUi-macos-app
          path: dist/mac/SfUi-*-osx-arm64.zip
          if-no-files-found: error
